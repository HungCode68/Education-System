spring.application.name=Education System

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8081

server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=/logs
server.tomcat.accesslog.prefix=access_log
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.pattern=common

logging.level.org.flywaydb=DEBUG

minio.endpoint=${MINIO_ENDPOINT}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket-name=${MINIO_BUCKET_NAME:lms-local}
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

spring.security.user.name=${APP_SECURITY_USER}
spring.security.user.password=${APP_SECURITY_PASSWORD}

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expirationMs=3600000
app.jwt.refreshExpirationMs=86400000

app.jwt.cookieName=lms_access_token
app.jwt.refreshCookieName=lms_refresh_token
app.jwt.cookieSecure=${JWT_COOKIE_SECURE:false}
app.jwt.cookieSameSite=${JWT_COOKIE_SAMESITE:Lax}

# Ollama Configuration
spring.ai.ollama.base-url=${OLLAMA_BASE_URL}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL}
spring.ai.ollama.embedding.options.model=${OLLAMA_EMBEDDING_MODEL}

# RAG Configuration
rag.similarity-threshold=0.6
rag.top-k=3
